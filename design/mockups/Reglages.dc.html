    </label>
    <label for="date" style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Date de l'examen
      <input id="date" type="date" value="2026-12-13" style="height: 48px; border: 1px solid #C9CCD8; border-radius: 14px; padding: 0 14px; font: inherit; font-weight: 400; font-size: 16px; color: #1D1F2C; background: #F7F8FB">
    </label>
  </form>

  <div style="background: #FFFFFF; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
    <h2 style="margin: 0; font-size: 15px; font-weight: 600">Sauvegarde</h2>
    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5B6072">Vos données restent sur ce téléphone. Gardez une copie pour changer de téléphone.</p>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="height: 48px; border-radius: 24px; border: 0; background: #E9E9FB; color: #3F3FB0; font: inherit; font-size: 14px; font-weight: 600">Exporter</button>
      <button type="button" style="height: 48px; border-radius: 24px; border: 0; background: #E9E9FB; color: #3F3FB0; font: inherit; font-size: 14px; font-weight: 600">Importer</button>
    </div>
  </div>

  <div style="background: #F8DF8B; border-radius: 22px; padding: 16px 18px; display: flex; gap: 12px; align-items: flex-start">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D1F2C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><rect x="6" y="2" width="12" height="20" rx="3"></rect><path d="M11 18h2"></path></svg>
    <span style="font-size: 14px; line-height: 1.5">Sur iPhone, touchez <strong>Partager</strong> puis <strong>Sur l'écran d'accueil</strong>. L'app marche hors ligne et vos données sont mieux conservées.</span>
  </div>

  <button type="button" style="margin-top: auto; height: 50px; border-radius: 25px; border: 0; background: transparent; color: #A3261F; font: inherit; font-size: 15px; font-weight: 600">Effacer toutes mes données</button>
